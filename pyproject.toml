[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-healing-network"
version = "0.1.0"
description = "Self-healing network topology testbed with graph-based simulation, failure prediction, and DRL-ready environments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "numpy",
    "PyYAML",
    "gymnasium>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
rl = ["stable-baselines3>=2.4", "sb3-contrib>=2.4", "torch>=2.3"]
mininet = []
plot = ["matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
